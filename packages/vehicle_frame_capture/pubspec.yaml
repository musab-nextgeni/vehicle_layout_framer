name: vehicle_frame_capture
description: >-
  A guided, multi-angle vehicle photo capture flow: a rectangular frame
  overlay, live device-level feedback, and camera integration in one widget.
version: 3.0.0
# Remove this line once you're ready to run `dart pub publish` for real —
# it's a safety guard so this package isn't published to the public
# registry by accident.
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
