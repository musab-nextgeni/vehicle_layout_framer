name: vehicle_frame_capture
description: >-
  A guided, multi-angle vehicle photo capture flow: a rectangular frame
  overlay, live device-level feedback, and camera integration in one widget.
version: 4.0.0
homepage: https://github.com/musab-nextgeni/vehicle_layout_framer
repository: https://github.com/musab-nextgeni/vehicle_layout_framer

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
